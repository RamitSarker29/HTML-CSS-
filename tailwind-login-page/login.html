<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="./output.css">
</head>
<body class="bg-gray-900 flex justify-center items-center min-h-screen">
    <div class="bg-gray-700 p-8 rounded-lg shadow-2xl max-w-sm w-full">
        <h2 class="text-center text-3xl font-bold text-white mb-6 ">Login</h2>
        <form>
            <div class="mb-4">
                <label for="" class="block text-sm font-medium text-gray-300 mb-2">Email:</label>
                <input type="email" class="bg-gray-400 w-full px-3 py-2 border-gray-700 rounded-md text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-900" placeholder="Enter your email" id="">
            </div>
            <div class="mb-6">
                <label for="" class="block text-sm font-medium text-gray-300 mb-2">Password:</label>
                <input type="password" class="bg-gray-400 w-full px-3 py-2 border-gray-700 rounded-md text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-900" name="" placeholder="Enter your password" id="">
            </div>
            <button type="submit" class="w-full bg-blue-900 p-2 text-gray-300 font-semibold rounded-md hover:bg-blue-950 shadow-2xl">Login</button>
        </form>
    </div>
</body>
</html>
